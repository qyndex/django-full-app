{% extends "base/base.html" %}

{% block title %}Password Reset Sent | Django Blog{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 col-lg-4 mx-auto">
        <div class="card">
            <div class="card-body text-center">
                <i class="bi bi-envelope-check" style="font-size: 3rem; color: var(--bs-success);"></i>
                <h3 class="mt-3">Check Your Email</h3>
                <p class="text-muted">
                    If an account exists with the email you entered, we've sent password reset instructions.
                </p>
                <a href="{% url 'accounts:login' %}" class="btn btn-outline-primary">Back to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
