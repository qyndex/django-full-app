{% extends "base/base.html" %}

{% block title %}Password Reset Complete | Django Blog{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 col-lg-4 mx-auto">
        <div class="card">
            <div class="card-body text-center">
                <i class="bi bi-check-circle" style="font-size: 3rem; color: var(--bs-success);"></i>
                <h3 class="mt-3">Password Reset Complete</h3>
                <p class="text-muted">Your password has been set. You can now log in with your new password.</p>
                <a href="{% url 'accounts:login' %}" class="btn btn-primary">Log In</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
